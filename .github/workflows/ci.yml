name: CI

# NOTE: this app depends on `hiero-receipts` and `@hiero-enterprise/mirror`,
# which are referenced via local `file:` paths and are not yet on npm. So this
# workflow only goes green once those are published (or this repo lives in a
# monorepo where the paths resolve). Until then it documents the intended
# gates; enable it when the dependencies are resolvable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
