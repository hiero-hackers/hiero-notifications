name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike a zero-dep library, this package has REAL runtime deps on the
      # org's GitHub Packages (@hiero-hackers/hiero-receipts, enterprise-mirror),
      # so npm ci needs registry auth. (If this 401s: grant this repo read
      # access on each package — package settings → Manage Actions access.)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run typecheck:examples
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint:package
      # The published artifact, not just the repo: install the packed tarball
      # into a scratch project; import the library and run the bin through it.
      - run: npm run test:pack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The container is a release artifact — a PR that breaks the Dockerfile
  # must fail HERE, not at the tag push. Build only; no push.
  docker-build:
    name: Container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker build (token as BuildKit secret, never in a layer)
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --secret id=npm_token,env=NPM_TOKEN -t ci-build-only .

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            # Bot commits (dependabot etc.) carry no DCO sign-off and never
            # will — the DCO is a statement by human contributors.
            author=$(git show -s --format='%an' "$sha")
            case "$author" in *"[bot]") continue ;; esac
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done
          exit $missing
